<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายการซื้อของ — ชุดเครื่องเขียนจากเศษอาหาร</title>
<style>
:root{--bg:#FBF7EE;--card:#fff;--ink:#26302B;--mut:#5F655C;--line:#E4DCC8;--acc:#3D5A45;--ok:#2F7D4F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1D1A;--card:#262925;--ink:#EDEBE4;--mut:#A8AB9F;--line:#3A3E37;--acc:#8FBF9F;--ok:#7CC79A}}
:root[data-theme="dark"]{--bg:#1B1D1A;--card:#262925;--ink:#EDEBE4;--mut:#A8AB9F;--line:#3A3E37;--acc:#8FBF9F;--ok:#7CC79A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5}
.w{max-width:820px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:18px}
.sum span{font-size:12px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.chips,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select,input{font:inherit;color:var(--ink)}
.chip,.tab{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"],.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:700}
.tool{margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.go{border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:5px 12px;cursor:pointer}
.g{margin-bottom:16px}
.g h2{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;border-left:5px solid var(--c);padding-left:8px}
.g h2 span{font-weight:400;color:var(--mut);font-size:13px}
.r{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.r.d{opacity:.6}
.r.d .n{text-decoration:line-through}
.r input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
.n{font-weight:600}
.t{text-align:right;font-weight:700;min-width:64px}
.e{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.e input,.e select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;width:70px}
.e select{width:auto}
.who{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;color:var(--mut)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:12px}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<h1>รายการซื้อของ</h1>
<div class="sub">ชุดเครื่องเขียนจากเศษอาหาร · ติ๊กแล้วทุกคนเห็นตรงกัน · แก้จำนวนและราคาได้</div>
<div id="off" class="note hide">ยังไม่ได้เชื่อมข้อมูลร่วม (อาจยังไม่ได้เข้าสู่ระบบ) ติ๊กและแก้ไขจะไม่ถูกบันทึกให้คนอื่นเห็น</div>
<div class="sum"><div><b id="s1">0</b><span>งบรวม (บาท)</span></div><div><b id="s2">0</b><span>ซื้อแล้ว (บาท)</span></div><div><b id="s3">0</b><span>ยังไม่ได้ซื้อ (บาท)</span></div></div>
<div class="bar"><i id="pb"></i></div>
<div class="chips" id="chips" role="group" aria-label="เลือกคน"></div>
<div class="tabs" id="tabs" role="group" aria-label="หน้า"></div>
<div id="out"></div>
</div>
<script>
var MEMBERS=["อิง","มิ้ว","อาย"],PEOPLE=["เลือกสมาชิก"].concat(MEMBERS);
var GR={pencil:["ไส้ดินสอ","#3D5A45"],eraser:["ยางลบ","#8A5A3B"],casing:["ปลอกดินสอ","#5B4E77"],coating:["สารเคลือบน้ำตาล","#B5651D"],gen:["อุปกรณ์กลาง","#5F655C"]};
var ITEMS=[
["pencil","p1","ดินเหนียว (100 g)",1,30],["pencil","p2","ภาชนะโลหะปิดเจาะรู (เผา)",2,60],["pencil","p3","คีมจับภาชนะร้อน",1,45],["pencil","p4","ครก/เครื่องบดกาแฟ",1,150],["pencil","p5","ตะแกรงร่อน mesh 80-100",1,90],["pencil","p6","ชามผสม",2,20],["pencil","p7","แม่พิมพ์หลอด/ไซริงค์ตัดปลาย",10,5],["pencil","p8","แก๊ส/ค่าไฟเผา-อบ (ประเมิน ครั้ง)",4,25],["pencil","p9","เทอร์โมมิเตอร์ทนความร้อน",1,120],
["eraser","e1","แป้งสาลี/แป้งข้าวโพด",1,25],["eraser","e2","ผ้าขาวบาง/ตะแกรงกรองน้ำมัน",2,15],["eraser","e3","ถุงพลาสติก/ภาชนะปิด (พักเนื้อ)",3,10],["eraser","e4","ถุงมือยาง",3,20],
["casing","c1","นมเพิ่ม (ถ้าเศษไม่พอ, ลิตร)",1,20],["casing","c2","น้ำส้มสายชู",1,15],["casing","c3","หม้อต้ม (แยกจากชุดเผาถ่าน)",1,120],["casing","c4","ผ้าขาวบาง/ตะแกรงกรอง",2,15],["casing","c5","แม่พิมพ์ทรงกระบอก/แผ่น",5,10],["casing","c6","มีดคัตเตอร์/กรรไกร",1,25],
["coating","s1","กรดซิตริก (ทำน้ำเชื่อมจากแป้ง)",1,40],["coating","s2","น้ำตาลทราย (สำรอง)",1,25],["coating","s3","เบกกิ้งโซดา (สะเทินกรด)",1,15],["coating","s4","กระทะ/หม้อเคี่ยว (แยกชุด)",1,90],["coating","s5","เทอร์โมมิเตอร์วัดน้ำตาล",1,150],["coating","s6","แปรงทา/พู่กัน",3,10],["coating","s7","คีมคีบชิ้นงาน",1,45],["coating","s8","ถุงมือกันความร้อน (คู่)",2,60],
["gen","g1","เครื่องชั่งดิจิทัล 0.1 g",1,250],["gen","g2","ช้อนตวง/ถ้วยตวง (ชุด)",2,20],["gen","g3","นาฬิกาจับเวลา",1,60],["gen","g4","หน้ากากกันฝุ่น/ควัน",5,15],["gen","g5","แว่นตานิรภัย",3,40],["gen","g6","สมุดบันทึกการทดลอง",1,35],["gen","g7","ดินสอ HB/2B/4B จริง (อ้างอิง)",3,10],["gen","g8","ซิลิกาเจล (เก็บรักษา)",1,30]];
var ov={},db=null,me="all",tab="all",pend=false;
try{me=localStorage.getItem("who")||"all"}catch(e){}
function cur(it){var o=ov[it[1]]||{};return{id:it[1],g:it[0],name:it[2],qty:o.qty!=null?+o.qty:it[3],price:o.price!=null?+o.price:it[4],done:!!o.done,who:o.who||null}}
function rows(){return ITEMS.map(function(it){var r=cur(it);r.who=r.who||"เลือกสมาชิก";r.sub=r.qty*r.price;return r})}
function fm(n){return Math.round(n*100)/100;}
function fmt(n){return fm(n).toLocaleString("th-TH")}
function save(id,patch){var it=ITEMS.filter(function(x){return x[1]===id})[0],c=cur(it);var o={qty:c.qty,price:c.price,done:c.done,who:ov[id]&&ov[id].who||null};for(var k in patch)o[k]=patch[k];ov[id]=o;render();if(db){db.doc("items/"+id).set(o).catch(function(){})}}
function rowHtml(r){return '<div class="r'+(r.done?' d':'')+'"><input type="checkbox" data-id="'+r.id+'" data-k="done"'+(r.done?' checked':'')+' aria-label="ซื้อแล้ว '+r.name+'"><span class="n">'+r.name+'</span><span class="t">'+fmt(r.sub)+'</span><div class="e">จำนวน <input type="number" min="0" data-id="'+r.id+'" data-k="qty" value="'+r.qty+'"> ราคา/หน่วย <input type="number" min="0" step="0.5" data-id="'+r.id+'" data-k="price" value="'+r.price+'"> <select data-id="'+r.id+'" data-k="who" aria-label="คนซื้อ">'+PEOPLE.map(function(p){return '<option'+(p===r.who?' selected':'')+'>'+p+'</option>'}).join('')+'</select></div></div>'}
function render(){
 var all=rows(),mine=me==="all"?all:all.filter(function(r){return r.who===me});
 var tot=0,got=0;all.forEach(function(r){tot+=r.sub;if(r.done)got+=r.sub});
 document.getElementById("s1").textContent=fmt(tot);document.getElementById("s2").textContent=fmt(got);document.getElementById("s3").textContent=fmt(tot-got);
 document.getElementById("pb").style.width=(tot?got/tot*100:0)+"%";
 document.getElementById("chips").innerHTML=["all"].concat(PEOPLE).map(function(p){var rs=p==="all"?all:all.filter(function(r){return r.who===p}),s=0;rs.forEach(function(r){s+=r.sub});return '<button class="chip" data-who="'+p+'" aria-pressed="'+(me===p)+'">'+(p==="all"?"ทุกคน":p==="เลือกสมาชิก"?"ยังไม่เลือกคน":p)+' · '+fmt(s)+'</button>'}).join('');
 var left=mine.filter(function(r){return !r.done});
 document.getElementById("tabs").innerHTML=[["all","รายการทั้งหมด ("+mine.length+")"],["left","ยังไม่ได้ซื้อ ("+left.length+")"]].map(function(t){return '<button class="tab" data-tab="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('');
 var h="";
 if(tab==="all"){Object.keys(GR).forEach(function(g){var rs=mine.filter(function(r){return r.g===g});if(!rs.length)return;var s=0;rs.forEach(function(r){s+=r.sub});h+='<div class="g" style="--c:'+GR[g][1]+'"><h2>'+GR[g][0]+'<span>'+fmt(s)+' บาท</span></h2>'+rs.map(rowHtml).join('')+'</div>'})}
 else{if(!left.length)h='<div class="note">ซื้อครบแล้ว ไม่มีรายการค้าง</div>';
  (me==="all"?PEOPLE:[me]).forEach(function(p){var rs=left.filter(function(r){return r.who===p});if(!rs.length)return;var s=0;rs.forEach(function(r){s+=r.sub});h+='<div class="g" style="--c:var(--acc)"><h2>'+(p==="เลือกสมาชิก"?"ยังไม่เลือกคนซื้อ":p)+' ยังต้องซื้อ '+rs.length+' ชิ้น<span>'+fmt(s)+' บาท</span></h2>'+rs.map(rowHtml).join('')+'</div>'})}
 document.getElementById("out").innerHTML=h;
}
document.addEventListener("change",function(e){var t=e.target,id=t.getAttribute("data-id");if(!id)return;var k=t.getAttribute("data-k"),p={};p[k]=k==="done"?t.checked:k==="who"?t.value:Math.max(0,+t.value||0);save(id,p)});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.who){me=b.dataset.who;try{localStorage.setItem("who",me)}catch(x){}render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}});
document.addEventListener("focusout",function(){if(pend){pend=false;setTimeout(render,0)}});
render();
(window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null)).then(function(d){
 if(!d){document.getElementById("off").className="note";return}
 db=d;
 d.collection("items").onSnapshot(function(s){var o={};s.docs.forEach(function(x){o[x.id]=x.data()});ov=o;var a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.type==="number"){pend=true}else render()},function(){document.getElementById("off").className="note"});
}).catch(function(){document.getElementById("off").className="note"});
</script>
</body>
</html>
